<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Task 4 Coursework</title>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	</head>
	<body>
		<div
			v-if="{{!displayCart}}"
			id="lessonDeets"
			style="border: 1rem; height: 500px; border-color: black; border-width: 1rem; display: flex; align-items: center; flex-direction: column">
			<h3>Subject: {{subject}}</h3>
			<h3>Location: {{location}}</h3>
			<h3>Price: {{price}}</h3>
			<img v-bind:src="imageProps.path" v-bind:alt="imageProps.alt" width="300" style="margin-bottom: 10px" />
			<button v-bind:disabled="!canAddToCart" v-on:click="addToCart()">Add To Cart</button>
			<button v-bind:disabled="!cart.length >= 1" v-on:click="toggleCart()" style="margin-top: 10px">Shopping Cart</button>
			<button v-on:click="numberOfItems()">Checkout</button>
		</div>
		<div v-else="{{displayCart}}"></div>
		<script type="module">
			const { createApp } = Vue;

			createApp({
				data() {
					return {
						id: 1001,
						subject: "Computer Science",
						location: "Mauritius",
						price: "4,000",
						imageProps: {
							path: "images/example-class.jpg",
							alt: "Picture of classroom",
						},
						availability: 2,
						cart: [],
						displayCart: false,
					};
				},

				computed: {
					canAddToCart() {
						if (this.availability > 0) return true;
					},

					numberOfItems() {
						return this.cart.length;
					},
				},

				methods: {
					addToCart() {
						this.availability = this.availability - 1;
						this.cart.push(this.id);
						this.cart.forEach((item) => console.log(item));
						console.log("Cart Length", this.cart.length);
					},

					toggleCart() {
						this.displayCart = !this.displayCart;
						console.log("Shopping Cart Status", this.displayCart);
					},
				},
			}).mount("#lessonDeets");
		</script>
	</body>
</html>
