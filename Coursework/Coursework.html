<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Task 4 Coursework</title>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<link rel="stylesheet" href="./styles.css"></link>
	</head>
	<body>
		<div id="app">
			<div
				v-if="!cartDetails.displayCart"
				id="lessonDeets"
				style="border: 1rem; height: 500px; border-color: black; border-width: 1rem; display: flex; align-items: center; flex-direction: column">
				<div v-for="lesson in lessons">
					<h3>Subject: {{lesson.subject}}</h3>
					<h3>Location: {{lesson.location}}</h3>
					<h3>Price: {{lesson.price}}</h3>
					<h3>Availability: {{lesson.availability}}</h3>
					<img v-bind:src="lesson.imageProps.path" v-bind:alt="lesson.imageProps.alt" width="300" style="margin-bottom: 10px" />
					<button v-bind:disabled="!canAddToCart(lesson)" v-on:click="addToCart(lesson.id)" style="margin-bottom: 10px">Add To Cart</button>
				</div>
				<button v-bind:disabled="cartDetails.cart.length === 0" v-on:click="toggleCart()" style="margin-bottom: 10px">Shopping Cart</button>
			</div>
			<div v-else>
				<div>
					<div style="display: flex; justify-content: space-between">
						<h1>Shopping Cart</h1>
						<button v-on:click="toggleCart()">Back</button>
					</div>
					<div class="customer-input-forms">
						<div>
							<label>First Name</label>
							<input v-model="order.firstName" />
						</div>
						<div>
							<label>Last Name</label>
							<input v-model="order.lastName" />
						</div>
						<div>
							<label>Telephone</label>
							<input type="tel" v-model="order.telephone" />
						</div>
					</div>
					<div style="display: flex; align-items: center; text-align: center; gap: 10px">
						<button v-bind:disabled="!canCheckOut" v-on:click="toggleCheckoutMessage()">Checkout</button>
						<div v-if="cartDetails.showCheckoutCount">{{numberOfItems}}</div>
					</div>
					<div class="cart-summary">
	          <h2>Cart Summary</h2>
	          <ul class="cart-item-list">
              <template v-for="lesson in lessons" :key="lesson.id">
                <li v-if="getLessonCopies(lesson.id) > 0" class="cart-item">
                {{lesson.subject}}
                <div>{{getLessonCopies(lesson.id)}} items</div>
                <button v-on:click="removeCartItem(lesson)">Remove Cart Item</button>
                </li>
              </template>
	          </ul>
          </div>
				</div>
			</div>
		</div>
		<script type="module">
			const { createApp } = Vue;

			createApp({
				data() {
					return {
						lessons: [
							{
								id: 1001,
								subject: "Computer Science",
								location: "Mauritius",
								price: "4,000",
								imageProps: {
									path: "images/example-class.jpg",
									alt: "Picture of classroom",
								},
								availability: 5,
							},
							{
								id: 1002,
								subject: "Mathematics",
								location: "Mauritius",
								price: "6,000",
								imageProps: {
									path: "images/class2.png",
									alt: "Picture of classroom",
								},
								availability: 5,
							},
							{
								id: 1003,
								subject: "Law",
								location: "Mauritius",
								price: "9,000",
								imageProps: {
									path: "images/class3.png",
									alt: "Picture of classroom",
								},
								availability: 5,
							},
						],
						cartDetails: {
							cart: [],
							displayCart: false,
							showCheckoutCount: false,
						},
						order: {
							firstName: "",
							lastName: "",
							telephone: "",
						},
					};
				},

				computed: {
					canCheckOut() {
						if (this.order.firstName === "" || this.order.lastName === "" || this.order.telephone === "") {
							console.log("Cannot checkout");
							return false;
						} else {
							return true;
						}
					},
					numberOfItems() {
						return this.cartDetails.cart.length;
					},
				},

				methods: {
					addToCart(id) {
						var lessons = this.lessons;
						for (var i = 0; i < lessons.length; i++) {
							if (lessons[i].id === id) {
								this.cartDetails.cart.push({...lessons[i]});
                this.getLessonCopies(lessons[i].id)
                console.log(JSON.stringify(this.cartDetails.cart, null, 2))
								lessons[i].availability -= 1;
								console.log(lessons[i].availability);
							}
						}
					},

					canAddToCart(lesson) {
						var lessons = this.lessons;
						if (lessons.includes(lesson)) {
							if (lesson.availability < 1) {
								return false;
							} else return true;
						}
						return;
					},

					getLessonCopies(lessonId) {
						var cartItemCopies = this.cartDetails.cart.filter((cartItem) => cartItem.id === lessonId).length;
            console.log("Lesson id" + lessonId + " has " + cartItemCopies + "copies")
            return cartItemCopies;
					},

          removeCartItem(lesson){
            const cart = this.cartDetails.cart;
            const index = cart.findLastIndex(itemInCart => itemInCart.id === lesson.id)
            if(index !== -1){              
              cart.splice(index, 1);
              lesson.availability += 1;
            }
            if(cart.length < 1){
              this.toggleCart();
            }
          },

					toggleCart() {
             if (this.cartDetails.cart.length === 0) {
    this.cartDetails.displayCart = false;
  } else {
    this.cartDetails.displayCart = !this.cartDetails.displayCart;
  }
					},

					toggleCheckoutMessage() {
						console.log(this.cartDetails.cart);
						alert("Your order has been confirmed");
						this.cartDetails.cart = [];
						this.toggleCart();
						this.order.firstName = "";
						this.order.lastName = "";
						this.order.telephone = "";
					},
				},
			}).mount("#app");
		</script>
	</body>
</html>
