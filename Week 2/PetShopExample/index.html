<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	</head>
	<body>
		<div id="app">
			<h1 v-text="sitename"></h1>
			<button v-on:click="toggleCheckout()" v-bind:disabled="numberOfItems === 0">Checkout ({{numberOfItems}})</button>

			<div v-if="!displayCart">
				<figure>
					<img v-bind:src="product.image" width="300" />
				</figure>
				<h2 v-text="product.title"></h2>
				<p v-text="product.description"></p>
				<p>Price: £{{product.price}}</p>
				<p>Availability: {{availability}}</p>

				<button v-on:click="addToCart()" v-bind:disabled="!canAddToCart">Add to Cart</button>
			</div>

			<div v-else>
				<button v-on:click="toggleCheckout()">Back</button>
				<h2>Checkout Page</h2>
				<p>
					<strong>Title:</strong>
					<select v-model="order.title">
						<option disabled value="">Select Title</option>
						<option>Mr</option>
						<option>Miss</option>
						<option>Mrs</option>
					</select>
				</p>
				<p>
					<strong>First Name:</strong>
					<input v-model="order.firstName" />
				</p>
				<p>
					<strong>Last Name:</strong>
					<input v-model="order.lastName" />
				</p>
				<p>
					<strong>Telephone:</strong>
					<input v-model="order.telephone" />
				</p>

				<h2>Order Summary</h2>
				<p>Title: {{order.title}}</p>
				<p>First Name: {{order.firstName}}</p>
				<p>Last Name: {{order.lastName}}</p>
				<p>Telephone: {{order.telephone}}</p>
				<p>
					Items in Cart: {{numberOfItems}}
					<button v-on:click="removeFromCart()" v-bind:disabled="numberOfItems === 0">Remove</button>
				</p>
			</div>
		</div>

		<script type="module">
			const { createApp } = Vue;
			const petstore = createApp({
				data() {
					return {
						sitename: "Vue.js Pet Depot",
						product: {
							id: 1001,
							title: "Cat Food, 25lb bag",
							description: "A 25 pound bag of irresistible, organic goodness for your cat.",
							price: 2000,
							image: "images/catFood.jpg",
							availableInventory: 5,
						},
						cart: [],
						displayCart: false,
						order: {
							title: "",
							firstName: "",
							lastName: "",
							telephone: "",
						},
					};
				},
				computed: {
					availability: function () {
						return this.product.availableInventory;
					},
					canAddToCart: function () {
						return this.product.availableInventory > 0;
					},
					numberOfItems: function () {
						return this.cart.length;
					},
				},
				methods: {
					addToCart() {
						this.cart.push(this.product.id);
						this.product.availableInventory -= 1;
					},
					removeFromCart() {
						if (this.cart.length > 0) {
							this.cart.pop();
							this.product.availableInventory += 1;
						}
					},
					toggleCheckout() {
						this.displayCart = !this.displayCart;
					},
				},
			});
			petstore.mount("#app");
		</script>
	</body>
</html>
